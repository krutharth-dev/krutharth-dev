name: Refresh GitHub profile cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-cards.yml'
      - 'scripts/profile_cards.py'
      - 'scripts/contribution_dashboard.py'
      - 'tests/test_profile_cards.py'
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -p test_profile_cards.py -v
      - name: Generate cards from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/profile_cards.py
      - name: Refresh contribution dashboard
        continue-on-error: true
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/contribution_dashboard.py
      - name: Publish cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats-light.svg assets/profile-stats-dark.svg assets/top-languages-light.svg assets/top-languages-dark.svg assets/contribution-dashboard.svg assets/contribution-streak.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh profile cards"
          git pull --rebase origin main
          git push origin HEAD:main
