<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-labelledby="title desc">
  <title id="title">Krutharth's animated developer introduction, mobile layout</title>
  <desc id="desc">Compact terminal animation cycling through software interests.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b24"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#263746"/></pattern>
  </defs>
  <style>
    .mono {font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;}
    .first {animation:first 12s ease-in-out infinite;}
    .second {opacity:0;animation:second 12s ease-in-out infinite;}
    .third {opacity:0;animation:third 12s ease-in-out infinite;}
    .cursor {animation:blink 1s steps(2,start) infinite;}
    .pulse {animation:pulse 2.5s ease-in-out infinite;}
    @keyframes first {0%,28%,100% {opacity:1} 32%,96% {opacity:0}}
    @keyframes second {0%,30%,64%,100% {opacity:0} 34%,60% {opacity:1}}
    @keyframes third {0%,62%,98%,100% {opacity:0} 66%,94% {opacity:1}}
    @keyframes blink {0%,49% {opacity:1} 50%,100% {opacity:0}}
    @keyframes pulse {0%,100% {opacity:1} 50% {opacity:.4}}
    @media (prefers-reduced-motion:reduce){.first,.second,.third,.cursor,.pulse {animation:none}.first {opacity:1}.second,.third {opacity:0}}
  </style>
  <rect x="1" y="1" width="398" height="228" rx="14" fill="url(#bg)" stroke="#303d49" stroke-width="2"/>
  <rect x="2" y="44" width="396" height="182" rx="12" fill="url(#dots)" opacity=".6"/>
  <path d="M2 44 H398" stroke="#303d49"/>
  <circle cx="21" cy="22" r="5" fill="#ff5f57"/><circle cx="38" cy="22" r="5" fill="#febc2e"/><circle cx="55" cy="22" r="5" fill="#28c840"/>
  <text class="mono" x="73" y="27" font-size="12" fill="#a5b0bd">krutharth@github</text>
  <circle class="pulse" cx="369" cy="22" r="5" fill="#3fb950"/>
  <text class="mono" x="22" y="82" font-size="16" fill="#7ee787">$</text>
  <text class="mono" x="43" y="82" font-size="16" fill="#e6edf3">whoami</text>
  <g class="mono" font-size="19" font-weight="600">
    <g class="first" fill="#79c0ff"><text x="22" y="123">I build AI-powered</text><text x="22" y="150">applications.</text></g>
    <g class="second" fill="#a5d6ff"><text x="22" y="123">I explore systems</text><text x="22" y="150">&amp; networks.</text></g>
    <g class="third" fill="#7ee787"><text x="22" y="123">I turn ideas into</text><text x="22" y="150">working software.</text></g>
  </g>
  <text class="mono" x="22" y="185" font-size="15" fill="#7ee787">$</text>
  <rect class="cursor" x="43" y="170" width="9" height="19" fill="#7ee787"/>
  <text class="mono" x="22" y="215" font-size="11" fill="#919daa">BUILD · TEST · LEARN · REPEAT</text>
</svg>
