<svg xmlns="http://www.w3.org/2000/svg" width="400" height="278" viewBox="0 0 400 278" role="img" aria-labelledby="title desc">
  <title id="title">Krutharth's animated mobile technology overview</title>
  <desc id="desc">Compact readable technology cards for Python, React, Node.js, systems, networking and Cloudflare.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset=".55" stop-color="#101e2b"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="card" x2="1"><stop stop-color="#161b22"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#223047" opacity=".55"/></pattern>
  </defs>
  <style>
    .ui {font-family: Inter, 'Segoe UI', Arial, sans-serif;}
    .mono {font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
    .card {fill:url(#card);stroke:#354354;stroke-width:1.2;}
    .name {fill:#e6edf3;font-size:17px;font-weight:600;}
    .pulse {animation:pulse 2.6s ease-in-out infinite;}
    .dash {stroke-dasharray:5 7;animation:dash 2.8s linear infinite;}
    @keyframes pulse {0%,100% {opacity:.4}50% {opacity:1}}
    @keyframes dash {to {stroke-dashoffset:-24}}
    @media (prefers-reduced-motion:reduce){.pulse,.dash {animation:none}}
  </style>
  <rect x="1" y="1" width="398" height="276" rx="15" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="12" y="12" width="376" height="254" rx="11" fill="url(#dots)" opacity=".55"/>
  <circle class="pulse" cx="26" cy="32" r="4" fill="#7ee787"/>
  <text x="40" y="36" class="ui" font-size="20" font-weight="700" fill="#f0f6fc">My toolbox</text>
  <text x="22" y="61" class="ui" font-size="13" fill="#a7b1bd">AI · Web · Systems · Networks</text>
  <path class="dash" d="M30 80 H368" stroke="#3fb950" stroke-width="1.5" opacity=".75"/>
  <g class="ui">
    <rect class="card" x="20" y="94" width="173" height="43" rx="10"/>
    <circle cx="36" cy="115" r="4" fill="#58a6ff"/><text class="name" x="50" y="121">Python</text>
    <rect class="card" x="207" y="94" width="173" height="43" rx="10"/>
    <circle cx="223" cy="115" r="4" fill="#d2a8ff"/><text class="name" x="237" y="121">React</text>
    <rect class="card" x="20" y="149" width="173" height="43" rx="10"/>
    <circle cx="36" cy="170" r="4" fill="#7ee787"/><text class="name" x="50" y="176">Node.js</text>
    <rect class="card" x="207" y="149" width="173" height="43" rx="10"/>
    <circle cx="223" cy="170" r="4" fill="#f2cc60"/><text class="name" x="237" y="176">Systems</text>
    <rect class="card" x="20" y="204" width="173" height="43" rx="10"/>
    <circle cx="36" cy="225" r="4" fill="#79c0ff"/><text class="name" x="50" y="231">Networking</text>
    <rect class="card" x="207" y="204" width="173" height="43" rx="10"/>
    <circle cx="223" cy="225" r="4" fill="#f2cc60"/><text class="name" x="237" y="231" font-size="15">Cloudflare</text>
  </g>
  <text x="200" y="264" class="mono" font-size="10" fill="#a7b1bd" text-anchor="middle">BUILD · CONNECT · DEPLOY</text>
</svg>
